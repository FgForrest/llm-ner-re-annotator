      - TAXONOMY_SAMPLE_MAX=${TAXONOMY_SAMPLE_MAX:-60}
      - TAXONOMY_SAMPLE_COVERAGE=${TAXONOMY_SAMPLE_COVERAGE:-0.65}
      - TAXONOMY_SAMPLE_MAX_TOTAL=${TAXONOMY_SAMPLE_MAX_TOTAL:-200}
      - TAXONOMY_SAMPLE_POOL_MAX=${TAXONOMY_SAMPLE_POOL_MAX:-0}
      - TAXONOMY_SAMPLE_SCOPE=${TAXONOMY_SAMPLE_SCOPE:-global}
      - TAXONOMY_SAMPLE_MIN_CLUSTER=${TAXONOMY_SAMPLE_MIN_CLUSTER:-3}
      - EMBEDDING_MAX_CHARS=${EMBEDDING_MAX_CHARS:-2000}
      - CHECKPOINT_DIR=/app/checkpoints
      - CHUNK_MAX_CHARS=${CHUNK_MAX_CHARS:-12000}
      - SPLIT_NER_RE=${SPLIT_NER_RE:-true}
    volumes: *label-vols
    command: ["revise"]
    restart: "no"

  # =========================================================================
  # FINALIZE — merge + stats (bez LLM)
  # =========================================================================
  labeler-finalize:
    profiles: ["finalize"]
    # Všechny labeler služby = JEDNA image (stejný Dockerfile i kontext) →
    # `./scripts/build.sh` ji postaví jednou a použijí ji všechny fáze.
    image: ${LABELER_IMAGE:-llm-ner-re-annotator:latest}
    build: { context: ., dockerfile: Dockerfile.labeler }
    environment:
      - DATA_DIR=/app/data
      - DATA_LOCALES=${DATA_LOCALES:-cs}
      - LLM_TIMEOUT_S=${LLM_TIMEOUT_S:-1800}
      - TAXONOMY_REASONING=${TAXONOMY_REASONING:-true}
      - TAXONOMY_MIN_LABELS=${TAXONOMY_MIN_LABELS:-8}
      - TAXONOMY_MAX_LABELS=${TAXONOMY_MAX_LABELS:-16}
      - TAXONOMY_AUDIT_RULER=${TAXONOMY_AUDIT_RULER:-combined}
      - TAXONOMY_AUDIT_EMBEDDING_WEIGHT=${TAXONOMY_AUDIT_EMBEDDING_WEIGHT:-0.5}
      - TAXONOMY_EMBEDDING_ENABLED=${TAXONOMY_EMBEDDING_ENABLED:-true}
      - TAXONOMY_EMBEDDING_MODEL=${TAXONOMY_EMBEDDING_MODEL:-BAAI/bge-m3}
      - TAXONOMY_EMBEDDING_DEVICE=${TAXONOMY_EMBEDDING_DEVICE:-auto}
      - TAXONOMY_EMBEDDING_REFINE_MAX_PAIRS=${TAXONOMY_EMBEDDING_REFINE_MAX_PAIRS:-10}
      - TAXONOMY_OWL_DISJOINT_MODE=${TAXONOMY_OWL_DISJOINT_MODE:-off}
      - FINAL_EXCLUDE_KEYPHRASES=${FINAL_EXCLUDE_KEYPHRASES:-true}
      - TAXONOMY_SAMPLES_PER_DATASET=${TAXONOMY_SAMPLES_PER_DATASET:-auto}
      - TAXONOMY_SAMPLE_MIN=${TAXONOMY_SAMPLE_MIN:-5}
      - TAXONOMY_SAMPLE_MAX=${TAXONOMY_SAMPLE_MAX:-60}
      - TAXONOMY_SAMPLE_COVERAGE=${TAXONOMY_SAMPLE_COVERAGE:-0.65}
      - TAXONOMY_SAMPLE_MAX_TOTAL=${TAXONOMY_SAMPLE_MAX_TOTAL:-200}
      - TAXONOMY_SAMPLE_POOL_MAX=${TAXONOMY_SAMPLE_POOL_MAX:-0}
      - TAXONOMY_SAMPLE_SCOPE=${TAXONOMY_SAMPLE_SCOPE:-global}
      - TAXONOMY_SAMPLE_MIN_CLUSTER=${TAXONOMY_SAMPLE_MIN_CLUSTER:-3}
      - EMBEDDING_MAX_CHARS=${EMBEDDING_MAX_CHARS:-2000}
      - CHECKPOINT_DIR=/app/checkpoints
      - CHUNK_MAX_CHARS=${CHUNK_MAX_CHARS:-12000}
      - SPLIT_NER_RE=${SPLIT_NER_RE:-true}
    volumes:
      - ${CHECKPOINT_DIR:-./checkpoints}:/app/checkpoints
    command: ["finalize"]
    restart: "no"
