x-gpu-deploy-extractor: &gpu-deploy-extractor
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            # Default 1 (single-GPU bezpečný fallback). Pro 2/4× B200 / 2× RTX PRO 6000 nastav
            # EXTRACTOR_TP_SIZE před `docker compose up`, nebo použij
            # ./scripts/run_production.sh / run_smoke_test.sh (interaktivní
            # prompt 1/2/4). Pozn.: pokud zde bude 2 a host má jen 1 GPU,
            # nvidia-container-cli vyhodí "device error: 1: unknown device".
            count: ${EXTRACTOR_TP_SIZE:-1}
            capabilities: [gpu]
  shm_size: "32gb"
  ulimits:
    memlock: -1
    stack: 67108864

x-gpu-deploy-critic: &gpu-deploy-critic
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: ${CRITIC_TP_SIZE:-1}
            capabilities: [gpu]
  shm_size: "16gb"
  ulimits:
    memlock: -1
    stack: 67108864

x-gpu-deploy-embedder: &gpu-deploy-embedder
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            # bge-m3 je malý (~1 GB vah), takže víc karet NEznamená větší
            # model, ale víc REPLIK (data parallel) — kódování korpusu se
            # rozloží. Default 1 = chování jako dřív.
            count: ${EMBEDDING_GPU_COUNT:-1}
            capabilities: [gpu]
  shm_size: "8gb"

x-label-vols: &label-vols
  - ${DATA_DIR:-./data}:/app/data:ro
  - ${CHECKPOINT_DIR:-./checkpoints}:/app/checkpoints
  # HF cache (HF_HOME=/models v Dockerfile.labeler) — embedding model fáze
  # taxonomie se stáhne jednou a sdílí s LLM kontejnery.
  - ${MODEL_CACHE_DIR:-./models}:/models

services:

  # =========================================================================
  # POŽADAVKY: CUDA 13+ runtime na hostu
  # =========================================================================
  # Všechny LLM image tagy musí být postavené proti CUDA 13 (NVFP4 vyžaduje
  # 5th-gen Tensor Cores na Blackwell SM120, které jsou plně podporované
  # až ve CUDA 13+ a odpovídajícím NVIDIA driveru ≥ 580).
  #
  # Default tagy:
  #   - SGLang:  lmsysorg/sglang:latest-cu130   (cu130 = CUDA 13.0)
  #   - vLLM:    vllm/vllm-openai:latest (cu130 build)
  #
  # Pokud používáš starší CUDA driver, dostaneš:
  #   "CUDA error: no kernel image is available for execution on the device"
  # → upgrade NVIDIA driver na ≥580 (CUDA 13.0 capable) a CUDA toolkit ≥13.0.

  # =========================================================================
  # EXTRACTOR — Qwen3.5-122B-A10B (default NVFP4)
  # =========================================================================
  # SGLang (preferovaný — Qwen3 native podpora, dobrý batching pro MoE).
  # POŽADAVEK: CUDA 13+ runtime (image tag obsahuje "-cu130").
  extractor-sglang:
    profiles: ["extract-sglang", "revise-sglang"]
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:latest-cu130}
    container_name: mudrc-extractor
    restart: unless-stopped
    environment:
      - HF_HOME=/models
      # HF_HUB_ENABLE_HF_TRANSFER je deprecated v novém huggingface_hub
      # (hf_transfer balíček už není ani používaný). Replacement je
      # HF_XET_HIGH_PERFORMANCE pro Xet-based vysokorychlostní download.
      - HF_XET_HIGH_PERFORMANCE=1
      - HF_TOKEN=${HF_TOKEN:-}
      # Suppress noisy DeprecationWarning z nvidia_cutlass_dsl (libka
      # interní, nemůžeme ji ovlivnit) + obecné DeprecationWarning z
      # huggingface_hub / vllm / sglang. Errory zůstávají vidět.
      - PYTHONWARNINGS=ignore::DeprecationWarning,ignore::FutureWarning
      # transformers má vlastní logger (ne Python warnings) — `torch_dtype
      # is deprecated! Use dtype instead!` apod. Verbosity=error potlačí
      # warning úroveň; real errory / tracebacky vidíme dál.
      - TRANSFORMERS_VERBOSITY=error
      - TRANSFORMERS_NO_ADVISORY_WARNINGS=1
    volumes:
      - ${MODEL_CACHE_DIR:-./models}:/models
    command:
      - sh
      - -c
      - |
        QUANT_FLAG=""
        if [ -n "${EXTRACTOR_QUANTIZATION:-}" ]; then
          QUANT_FLAG="--quantization=${EXTRACTOR_QUANTIZATION:-}"
        fi
        # Per-container override (EXTRACTOR_*) má prioritu nad globálním fallbackem.
        EFF_PIECEWISE="${EXTRACTOR_DISABLE_PIECEWISE_CUDA_GRAPH:-${DISABLE_PIECEWISE_CUDA_GRAPH:-}}"
        PIECEWISE_FLAG=""
        if [ "$$EFF_PIECEWISE" = "1" ] || [ "$$EFF_PIECEWISE" = "true" ]; then
          PIECEWISE_FLAG="--disable-piecewise-cuda-graph"
        fi
        # SGLang alokuje mamba/GDN conv cache podle SGLANG_MAMBA_CONV_DTYPE
        # (default bf16) a IGNORUJE --dtype -> u fp16 modelu spadne prvni
        # prefill na "Index put requires the source and destination dtypes
        # match" (sgl-project/sglang#30178). Default = EXTRACTOR_DTYPE.
        MAMBA_CONV_DTYPE="${SGLANG_MAMBA_CONV_DTYPE:-}"
        if [ -z "$$MAMBA_CONV_DTYPE" ]; then
          MAMBA_CONV_DTYPE="${EXTRACTOR_DTYPE:-}"
        fi
        if [ -n "$$MAMBA_CONV_DTYPE" ]; then
          export SGLANG_MAMBA_CONV_DTYPE="$$MAMBA_CONV_DTYPE"
        fi
        # SGLang Marlin MoE (INT4 na Ampere) chce aktivace v dtype scales
        # checkpointu — u nekterych INT4 vah je potreba DTYPE=float16.
        # Prazdne = auto-detect z config.json.
        DTYPE_FLAG=""
        if [ -n "${EXTRACTOR_DTYPE:-}" ]; then
          DTYPE_FLAG="--dtype=${EXTRACTOR_DTYPE:-}"
        fi
        # Diagnostika do logu: at je hned videt, s jakym dtype server
        # startuje (fp16 vahy vs. bf16 GDN conv cache = sglang#30178).
        # --language-model-only NEPOUZIVAME: SGLang ho podporuje jen pro
        # MuseGlimmer/Cosmos3 architektury, u Gemma4 i Qwen3.5 server skonci
        # na "ValueError: --language-model-only does not support [...]".
        # Zapnout jen pro model, u ktereho to SGLang umi: LANGUAGE_MODEL_ONLY=1
        LANG_ONLY_FLAG=""
        if [ "${LANGUAGE_MODEL_ONLY:-0}" = "1" ]; then
          LANG_ONLY_FLAG="--language-model-only"
        fi
        # --- Mamba state pool (hybridni model: GDN vrstvy + full attention) ---
        # U Qwen3.5-A10B NEurcuje souběžnost KV cache, ale mamba state pool.
        # SGLang si ho bez --max-mamba-cache-size dopocita z
        # --mamba-full-memory-ratio (default 0.9 = mamba:KV 0.9:1) a pak
        # ZASTROPUJE --max-running-requests na
        #   max_mamba_cache_size / sloty_na_request
        # (5 pri strategii extra_buffer, 4 pri extra_buffer_lazy). V logu:
        #   "max_running_requests is capped to N by the mamba state cache".
        # Explicitni hodnota ratio PREBIJE: pool = (N+1) * slot, KV dostane
        # zbytek. Prazdne = SGLang default (chovani jako dosud).
        MAMBA_CACHE_FLAG=""
        if [ -n "${EXTRACTOR_MAX_MAMBA_CACHE:-}" ]; then
          MAMBA_CACHE_FLAG="--max-mamba-cache-size=${EXTRACTOR_MAX_MAMBA_CACHE:-}"
        fi
        # bfloat16 misto fp32 = polovicni slot (37 vs 73 MiB na GPU pri TP=2),
        # tedy dvojnasobna souběžnost za stejnou pamet. Triton GDN kernel pocita
        # v fp32 a jen PERSISTUJE stav v bf16 po kazdem tokenu -> je to zmena
        # numeriky, nez to zapnes, over kvalitu na vzorku. Prazdne = fp32.
        MAMBA_SSM_DTYPE_FLAG=""
        if [ -n "${EXTRACTOR_MAMBA_SSM_DTYPE:-}" ]; then
          MAMBA_SSM_DTYPE_FLAG="--mamba-ssm-dtype=${EXTRACTOR_MAMBA_SSM_DTYPE:-}"
        fi
        # extra_buffer_lazy odklada druhy tracking slot -> 4 sloty na request
        # misto 5, tedy +25 % souběžnosti pri STEJNE pameti a STEJNE numerice.
        # Vyzaduje overlap scheduler (default ON) a zadnou PD disagregaci.
        # Prazdne = auto (= extra_buffer). Radix cache zustava zapnuta.
        MAMBA_RADIX_FLAG=""
        if [ -n "${EXTRACTOR_MAMBA_RADIX_STRATEGY:-}" ]; then
          MAMBA_RADIX_FLAG="--mamba-radix-cache-strategy=${EXTRACTOR_MAMBA_RADIX_STRATEGY:-}"
        fi
        echo "[extractor] dtype: $${DTYPE_FLAG:-<auto>} | SGLANG_MAMBA_CONV_DTYPE=$${SGLANG_MAMBA_CONV_DTYPE:-<unset>}"
        echo "[extractor] mamba: $${MAMBA_CACHE_FLAG:-<auto>} $${MAMBA_SSM_DTYPE_FLAG:-<fp32>} $${MAMBA_RADIX_FLAG:-<auto>}"
        exec python3 -m sglang.launch_server \
          --model-path=${EXTRACTOR_MODEL:-RedHatAI/Qwen3.5-122B-A10B-NVFP4} \
          --host=0.0.0.0 \
          --port=8000 \
          --tp=${EXTRACTOR_TP_SIZE:-1} \
          --mem-fraction-static=${EXTRACTOR_MEM_FRACTION:-0.85} \
          --max-running-requests=${EXTRACTOR_BATCH_SIZE:-32} \
          --context-length=${EXTRACTOR_CONTEXT_LEN:-65536} \
          --reasoning-parser=qwen3 \
          --trust-remote-code \
          $$QUANT_FLAG $$PIECEWISE_FLAG $$DTYPE_FLAG $$LANG_ONLY_FLAG \
          $$MAMBA_CACHE_FLAG $$MAMBA_SSM_DTYPE_FLAG $$MAMBA_RADIX_FLAG
    ports: ["8000:8000"]
    <<: *gpu-deploy-extractor
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 60
      # Cold-start prostor VČETNĚ prvního stažení vah z HF (Qwen ~80 GB může
      # trvat desítky minut). Laditelné přes LLM_HEALTH_START_PERIOD v .env —
      # na pomalé lince zvyš (např. 7200s). Velká hodnota NEzpomaluje teplé
      # starty: healthy se hlásí hned po prvním úspěšném checku.
      start_period: ${LLM_HEALTH_START_PERIOD:-3600s}

  # vLLM (fallback — používá flashinfer_cutlass MoE backend pro NVFP4).
  # POŽADAVEK: CUDA 13+ runtime (image tag musí obsahovat "-cu130" nebo musí
  # být explicitně postaven proti CUDA 13).
  extractor-vllm:
    profiles: ["extract-vllm", "revise-vllm"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: mudrc-extractor
    restart: unless-stopped
    environment:
      - HF_HOME=/models
      # HF_HUB_ENABLE_HF_TRANSFER je deprecated v novém huggingface_hub
      # (hf_transfer balíček už není ani používaný). Replacement je
      # HF_XET_HIGH_PERFORMANCE pro Xet-based vysokorychlostní download.
      - HF_XET_HIGH_PERFORMANCE=1
      - HF_TOKEN=${HF_TOKEN:-}
      # Suppress noisy DeprecationWarning z nvidia_cutlass_dsl (libka
      # interní, nemůžeme ji ovlivnit) + obecné DeprecationWarning z
      # huggingface_hub / vllm / sglang. Errory zůstávají vidět.
      - PYTHONWARNINGS=ignore::DeprecationWarning,ignore::FutureWarning
      # transformers má vlastní logger (ne Python warnings) — `torch_dtype
      # is deprecated! Use dtype instead!` apod. Verbosity=error potlačí
      # warning úroveň; real errory / tracebacky vidíme dál.
      - TRANSFORMERS_VERBOSITY=error
      - TRANSFORMERS_NO_ADVISORY_WARNINGS=1
    volumes:
      - ${MODEL_CACHE_DIR:-./models}:/models
    # Quantization flag se aplikuje na základě EXTRACTOR_QUANTIZATION env.
    # Image vllm/vllm-openai má ENTRYPOINT ["vllm","serve"] → bez přepsání by
    # se spustilo `vllm serve sh -c …` a server by nenaběhl.
    entrypoint: ["sh", "-c"]
    command:
      - |
        QUANT_FLAG=""
        if [ -n "${EXTRACTOR_QUANTIZATION:-}" ]; then
          QUANT_FLAG="--quantization=${EXTRACTOR_QUANTIZATION:-}"
        fi
        # Pro NVFP4 MoE Qwen3.5 je nutný flashinfer_cutlass MoE backend
        # flashinfer_cutlass MoE backend je pro NVFP4 na Blackwellu; na Ampere
        # (A100: INT4/FP8 přes Marlin) se NESMÍ zapnout → řídí se MODELEM, ne
        # jen tím, že je nastavená kvantizace.
        MOE_FLAG=""
        case "${EXTRACTOR_MODEL:-}" in
          *NVFP4*|*nvfp4*|*-FP4*|*-fp4*) MOE_FLAG="--moe_backend=flashinfer_cutlass" ;;
        esac
        # SGLang Marlin MoE (INT4 na Ampere) chce aktivace v dtype scales
        # checkpointu — u nekterych INT4 vah je potreba DTYPE=float16.
        # Prazdne = auto-detect z config.json.
        DTYPE_FLAG=""
        if [ -n "${EXTRACTOR_DTYPE:-}" ]; then
          DTYPE_FLAG="--dtype=${EXTRACTOR_DTYPE:-}"
        fi
        exec python3 -m vllm.entrypoints.openai.api_server \
          --model=${EXTRACTOR_MODEL:-RedHatAI/Qwen3.5-122B-A10B-NVFP4} \
          --host=0.0.0.0 \
          --port=8000 \
          --tensor-parallel-size=${EXTRACTOR_TP_SIZE:-2} \
          --gpu-memory-utilization=${EXTRACTOR_MEM_FRACTION:-0.85} \
          --max-num-seqs=${EXTRACTOR_BATCH_SIZE:-32} \
          --max-model-len=${EXTRACTOR_CONTEXT_LEN:-65536} \
          --reasoning-parser=qwen3 \
          --language-model-only \
          $$QUANT_FLAG $$MOE_FLAG $$DTYPE_FLAG
    ports: ["8000:8000"]
    <<: *gpu-deploy-extractor
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 60
      # Cold-start prostor VČETNĚ prvního stažení vah z HF (Qwen ~80 GB může
      # trvat desítky minut). Laditelné přes LLM_HEALTH_START_PERIOD v .env —
      # na pomalé lince zvyš (např. 7200s). Velká hodnota NEzpomaluje teplé
      # starty: healthy se hlásí hned po prvním úspěšném checku.
      start_period: ${LLM_HEALTH_START_PERIOD:-3600s}

  # =========================================================================
  # CRITIC — Gemma 4 31B (default NVFP4, ~16 GB)
  # =========================================================================
  # SGLang (preferovaný)
  critic-sglang:
    profiles: ["critic-sglang"]
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:latest-cu130}
    container_name: mudrc-critic
    restart: unless-stopped
    environment:
      - HF_HOME=/models
      # HF_HUB_ENABLE_HF_TRANSFER je deprecated v novém huggingface_hub
      # (hf_transfer balíček už není ani používaný). Replacement je
      # HF_XET_HIGH_PERFORMANCE pro Xet-based vysokorychlostní download.
      - HF_XET_HIGH_PERFORMANCE=1
      - HF_TOKEN=${HF_TOKEN:-}
      # Suppress noisy DeprecationWarning z nvidia_cutlass_dsl (libka
      # interní, nemůžeme ji ovlivnit) + obecné DeprecationWarning z
      # huggingface_hub / vllm / sglang. Errory zůstávají vidět.
      - PYTHONWARNINGS=ignore::DeprecationWarning,ignore::FutureWarning
      # transformers má vlastní logger (ne Python warnings) — `torch_dtype
      # is deprecated! Use dtype instead!` apod. Verbosity=error potlačí
      # warning úroveň; real errory / tracebacky vidíme dál.
      - TRANSFORMERS_VERBOSITY=error
      - TRANSFORMERS_NO_ADVISORY_WARNINGS=1
    volumes:
      - ${MODEL_CACHE_DIR:-./models}:/models
    command:
      - sh
      - -c
      - |
        QUANT_FLAG=""
        if [ -n "${CRITIC_QUANTIZATION:-}" ]; then
          QUANT_FLAG="--quantization=${CRITIC_QUANTIZATION:-}"
        fi
        # Per-container override (CRITIC_*) má prioritu nad globálním fallbackem.
        EFF_PIECEWISE="${CRITIC_DISABLE_PIECEWISE_CUDA_GRAPH:-${DISABLE_PIECEWISE_CUDA_GRAPH:-}}"
        PIECEWISE_FLAG=""
        if [ "$$EFF_PIECEWISE" = "1" ] || [ "$$EFF_PIECEWISE" = "true" ]; then
          PIECEWISE_FLAG="--disable-piecewise-cuda-graph"
        fi
        # SGLang Marlin MoE (INT4 na Ampere) chce aktivace v dtype scales
        # checkpointu — u nekterych INT4 vah je potreba DTYPE=float16.
        # Prazdne = auto-detect z config.json.
        DTYPE_FLAG=""
        if [ -n "${CRITIC_DTYPE:-}" ]; then
          DTYPE_FLAG="--dtype=${CRITIC_DTYPE:-}"
        fi
        # --language-model-only NEPOUZIVAME: SGLang ho podporuje jen pro
        # MuseGlimmer/Cosmos3 architektury, u Gemma4 i Qwen3.5 server skonci
        # na "ValueError: --language-model-only does not support [...]".
        # Zapnout jen pro model, u ktereho to SGLang umi: LANGUAGE_MODEL_ONLY=1
        LANG_ONLY_FLAG=""
        if [ "${LANGUAGE_MODEL_ONLY:-0}" = "1" ]; then
          LANG_ONLY_FLAG="--language-model-only"
        fi
        exec python3 -m sglang.launch_server \
          --model-path=${CRITIC_MODEL:-nvidia/Gemma-4-31B-IT-NVFP4} \
          --host=0.0.0.0 \
          --port=8001 \
          --tp=${CRITIC_TP_SIZE:-1} \
          --mem-fraction-static=${CRITIC_MEM_FRACTION:-0.85} \
          --max-running-requests=${CRITIC_BATCH_SIZE:-64} \
          --context-length=${CRITIC_CONTEXT_LEN:-65536} \
          $$QUANT_FLAG $$PIECEWISE_FLAG $$DTYPE_FLAG $$LANG_ONLY_FLAG
    ports: ["8001:8001"]
    <<: *gpu-deploy-critic
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8001/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      # Cold-start prostor VČETNĚ prvního stažení vah z HF. Laditelné přes
      # LLM_HEALTH_START_PERIOD v .env (na pomalé lince zvyš, např. 7200s).
      start_period: ${LLM_HEALTH_START_PERIOD:-3600s}

  # vLLM (fallback — oficiální NVIDIA NVFP4 checkpoint je vLLM-targeted).
  # POŽADAVEK: CUDA 13+ runtime (image tag musí obsahovat "-cu130").
  critic-vllm:
    profiles: ["critic-vllm"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: mudrc-critic
    restart: unless-stopped
    environment:
      - HF_HOME=/models
      # HF_HUB_ENABLE_HF_TRANSFER je deprecated v novém huggingface_hub
      # (hf_transfer balíček už není ani používaný). Replacement je
      # HF_XET_HIGH_PERFORMANCE pro Xet-based vysokorychlostní download.
      - HF_XET_HIGH_PERFORMANCE=1
      - HF_TOKEN=${HF_TOKEN:-}
      # Suppress noisy DeprecationWarning z nvidia_cutlass_dsl (libka
      # interní, nemůžeme ji ovlivnit) + obecné DeprecationWarning z
      # huggingface_hub / vllm / sglang. Errory zůstávají vidět.
      - PYTHONWARNINGS=ignore::DeprecationWarning,ignore::FutureWarning
      # transformers má vlastní logger (ne Python warnings) — `torch_dtype
      # is deprecated! Use dtype instead!` apod. Verbosity=error potlačí
      # warning úroveň; real errory / tracebacky vidíme dál.
      - TRANSFORMERS_VERBOSITY=error
      - TRANSFORMERS_NO_ADVISORY_WARNINGS=1
    volumes:
      - ${MODEL_CACHE_DIR:-./models}:/models
    # Image vllm/vllm-openai má ENTRYPOINT ["vllm","serve"] → bez přepsání by
    # se spustilo `vllm serve sh -c …` a server by nenaběhl.
    entrypoint: ["sh", "-c"]
    command:
      - |
        QUANT_FLAG=""
        if [ -n "${CRITIC_QUANTIZATION:-}" ]; then
          QUANT_FLAG="--quantization=${CRITIC_QUANTIZATION:-}"
        fi
        # SGLang Marlin MoE (INT4 na Ampere) chce aktivace v dtype scales
        # checkpointu — u nekterych INT4 vah je potreba DTYPE=float16.
        # Prazdne = auto-detect z config.json.
        DTYPE_FLAG=""
        if [ -n "${CRITIC_DTYPE:-}" ]; then
          DTYPE_FLAG="--dtype=${CRITIC_DTYPE:-}"
        fi
        exec python3 -m vllm.entrypoints.openai.api_server \
          --model=${CRITIC_MODEL:-nvidia/Gemma-4-31B-IT-NVFP4} \
          --host=0.0.0.0 \
          --port=8001 \
          --tensor-parallel-size=${CRITIC_TP_SIZE:-1} \
          --gpu-memory-utilization=${CRITIC_MEM_FRACTION:-0.85} \
          --max-num-seqs=${CRITIC_BATCH_SIZE:-64} \
          --max-model-len=${CRITIC_CONTEXT_LEN:-65536} \
          --reasoning-parser=gemma4 \
          --limit-mm-per-prompt='{"image":0}' \
          $$QUANT_FLAG
    ports: ["8001:8001"]
    <<: *gpu-deploy-critic
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8001/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      # Cold-start prostor VČETNĚ prvního stažení vah z HF. Laditelné přes
      # LLM_HEALTH_START_PERIOD v .env (na pomalé lince zvyš, např. 7200s).
      start_period: ${LLM_HEALTH_START_PERIOD:-3600s}

  # =========================================================================
  # EMBEDDER — BAAI/bge-m3 na vLLM (fáze 0a: výběr vzorků pro taxonomii)
  # =========================================================================
  # JEDINÁ služba pipeline na vLLM (ostatní LLM běží na SGLang). vLLM má pro
  # bge-m3 oficiální podporu: config.json deklaruje XLMRobertaModel, override
  # na BgeM3EmbeddingModel načte správné embedding váhy (docs.vllm.ai →
  # Pooling models → Specific Model Examples).
  # Běží SÁM na GPU PŘED fází 0 (Qwen ještě neběží) — pravidlo "1 model na GPU".
  # Image vllm/vllm-openai má ENTRYPOINT ["vllm","serve"] → přepsán na sh -c.
  embedder-vllm:
    profiles: ["embed-vllm"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: mudrc-embedder
    restart: unless-stopped
    environment:
      - HF_HOME=/models
      - HF_XET_HIGH_PERFORMANCE=1
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTHONWARNINGS=ignore::DeprecationWarning,ignore::FutureWarning
      - TRANSFORMERS_VERBOSITY=error
      - TRANSFORMERS_NO_ADVISORY_WARNINGS=1
    volumes:
      - ${MODEL_CACHE_DIR:-./models}:/models
    entrypoint: ["sh", "-c"]
    command:
      - |
        MODEL="${TAXONOMY_EMBEDDING_MODEL:-BAAI/bge-m3}"
        set -- --runner pooling
        case "$$MODEL" in
          *bge-m3*) set -- "$$@" --hf-overrides '{"architectures": ["BgeM3EmbeddingModel"]}' --pooler-config.task embed ;;
        esac
        # Víc karet = víc replik modelu (data parallel), ne větší model.
        # bge-m3 se vejde na jednu kartu, takže tensor parallel by jen přidal
        # komunikaci; DP rozloží dávky textů mezi karty.
        DP="${EMBEDDING_GPU_COUNT:-1}"
        if [ "$$DP" -gt 1 ]; then
          set -- "$$@" --data-parallel-size "$$DP"
        fi
